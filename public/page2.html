<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جيب (Jaib) - طلب القرض</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ✅ Arabic Font (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --jaib-red: #D9142B;          /* Jaib Signature Crimson Red */
            --jaib-red-dark: #B00E21;
            --jaib-dark: #18181B;         /* Deep Charcoal Text */
            --jaib-accent-red: #C81026;
            --bg-color: #F7F7F8;
            --card-bg: #FFFFFF;
            --soft-red-bg: #FFF5F6;
            --soft-red-border: #FAD1D6;
            --text-main: #111111;
            --text-muted: #666666;
            --input-border: #E5E7EB;
            --input-focus: #D9142B;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        /* Top Header Navigation Bar - Jaib Red */
        .app-header {
            width: 100%;
            background-color: var(--jaib-red);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(217, 20, 43, 0.22);
        }

        .back-btn {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-brand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jaib-logo-badge {
            width: 32px;
            height: 32px;
            background: #FFFFFF;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 900;
            color: #FFFFFF;
        }

        .header-title .region {
            color: var(--jaib-red);
            background: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 5px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #FFFFFF;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #F0F0F0;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 900;
        }

        .subtext {
            font-size: 14px;
            color: var(--jaib-accent-red);
            text-align: center;
            margin-bottom: 22px;
            font-weight: 800;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 30px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #E5E7EB;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--jaib-red);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 800;
            color: var(--jaib-dark);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 13px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #FFFFFF;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: #A0AEC0;
        }

        .form-control:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(217, 20, 43, 0.1);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23D9142B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: left 16px center;
            background-size: 15px;
            padding-left: 42px;
            cursor: pointer;
        }

        textarea.form-control {
            resize: none;
            height: 95px;
            font-family: inherit;
        }

        .field-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Red CTA Button */
        .btn-next {
            background-color: var(--jaib-red);
            color: #FFFFFF;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(217, 20, 43, 0.32);
        }

        .btn-next:active {
            background-color: var(--jaib-red-dark);
            transform: scale(0.99);
        }

        /* Footer */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Jaib Red Header Navigation Bar -->
<div class="app-header">
    <a href="/" class="back-btn">← رجوع</a>
    <div class="header-brand">
        <div class="jaib-logo-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6H8M11 6H19V13C19 16.866 15.866 20 12 20C8.13401 20 5 16.866 5 13V11" stroke="#D9142B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9.5" cy="10.5" r="2" fill="#D9142B"/>
            </svg>
        </div>
        <div class="header-title">
            <span>جيب</span><span class="region">Jaib</span>
        </div>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 1 من 3</div>

    <!-- Step Bar Progress Indicators -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Application Form -->
    <form id="loanForm" onsubmit="submitStep1(event)">
        <div class="form-group">
            <label for="loanType">نوع القرض</label>
            <select id="loanType" class="form-control" required>
                <option value="Personal Loan" selected>قرض شخصي</option>
                <option value="Business Loan">قرض مشروع / تجاري</option>
                <option value="Education Loan">قرض تعليمي</option>
                <option value="Emergency Loan">قرض طارئ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanAmt">مبلغ القرض (YER)</label>
            <input
                type="number"
                id="loanAmt"
                class="form-control"
                placeholder="250000"
                min="10000"
                max="2500000"
                step="5000"
                value="250000"
                required
            >
            <span class="field-hint">الحد المسموح: من 10,000 YER إلى 2,500,000 YER</span>
        </div>

        <div class="form-group">
            <label for="loanTerm">مدة السداد</label>
            <select id="loanTerm" class="form-control" required>
                <option value="6 Months">6 أشهر</option>
                <option value="12 Months" selected>12 شهر</option>
                <option value="18 Months">18 شهر</option>
                <option value="24 Months">24 شهر</option>
                <option value="36 Months">36 شهر</option>
                <option value="48 Months">48 شهر</option>
                <option value="60 Months">60 شهر</option>
            </select>
        </div>

        <div class="form-group">
            <label for="loanPurpose">الغرض من القرض</label>
            <textarea
                id="loanPurpose"
                class="form-control"
                placeholder="حدد هدفك (مثلاً: مشروع، جهاز، سفر، أو أي هدف في بالك)..."
                required
            ></textarea>
        </div>

        <button type="submit" class="btn-next">التالي</button>
    </form>
</div>

<!-- Footer Banner -->
<div class="footer-banner">
    © 2026 محفظة جيب (Jaib) - اليمن #تغنيك_عن_الجميع
</div>

<script>
    const MIN_LOAN_AMT = 10000;
    const MAX_LOAN_AMT = 2500000;

    function clampLoanAmount(val) {
        const num = Number(val);
        if (Number.isNaN(num) || num < MIN_LOAN_AMT) return MIN_LOAN_AMT;
        if (num > MAX_LOAN_AMT) return MAX_LOAN_AMT;
        return num;
    }

    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Retrieve stored calculations from previous step if available
        const savedAmount = localStorage.getItem('loan_amount') || localStorage.getItem('amount') || localStorage.getItem('appliedAmount');
        const savedDuration = localStorage.getItem('loan_term') || localStorage.getItem('loanDuration') || localStorage.getItem('duration');

        if (savedAmount) {
            const digitsOnly = savedAmount.toString().replace(/\D/g, '');
            if (digitsOnly) {
                document.getElementById('loanAmt').value = clampLoanAmount(digitsOnly);
            }
        }

        if (savedDuration) {
            const formattedDuration = savedDuration.toString().trim().toLowerCase();
            const selectEl = document.getElementById('loanTerm');
            
            for (let i = 0; i < selectEl.options.length; i++) {
                if (
                    selectEl.options[i].value.toLowerCase().includes(formattedDuration) ||
                    formattedDuration.includes(selectEl.options[i].value.toLowerCase().replace(/\D/g, ''))
                ) {
                    selectEl.selectedIndex = i;
                    break;
                }
            }
        }
    };

    function submitStep1(event) {
        event.preventDefault();

        const loanType = document.getElementById('loanType').value;
        const loanAmtInput = document.getElementById('loanAmt');
        const loanAmt = clampLoanAmount(loanAmtInput.value);
        loanAmtInput.value = loanAmt;

        const loanTermVal = document.getElementById('loanTerm').value;
        const loanPurpose = document.getElementById('loanPurpose').value;

        // Parse duration number (e.g. "12 Months" -> 12)
        const months = Number(loanTermVal.replace(/\D/g, '')) || 12;

        // Calculate monthly payment with 5% annual interest rate
        const annualRate = 0.05;
        const totalInterest = loanAmt * annualRate * (months / 12);
        const monthlyPayment = Math.round((loanAmt + totalInterest) / months);

        // Save data across key variations
        localStorage.setItem('loan_amount', loanAmt);
        localStorage.setItem('amount', loanAmt);
        localStorage.setItem('appliedAmount', loanAmt);

        localStorage.setItem('loan_term', months);
        localStorage.setItem('duration', months);
        localStorage.setItem('appliedTerm', loanTermVal);

        localStorage.setItem('monthly_repayment', monthlyPayment);
        localStorage.setItem('appliedLoanType', loanType);
        localStorage.setItem('appliedPurpose', loanPurpose);

        // Transition to Page 3
        window.location.href = "/page3"; 
    }
</script>

</body>
</html>
